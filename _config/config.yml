---
Name: ai-refine
---
SilverStripe\CMS\Model\SiteTree:
  extensions:
    - SilverstripeLtd\AiRefine\Extensions\RefineSiteTreeExtension

SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - SilverstripeLtd\AiRefine\Extensions\RefineSiteConfigExtension

SilverstripeLtd\AiRefine\Services\RefineCheckRateLimiter:
  max_requests: 10
  window_seconds: 300

SilverStripe\Control\Director:
  rules:
    'admin/ai-refine': SilverstripeLtd\AiRefine\Controllers\RefineController

SilverStripe\Admin\LeftAndMain:
  extra_requirements_javascript:
    'silverstripeltd/ai-refine:client/dist/js/bundle.js':
      defer: true
  extra_requirements_css:
    - 'silverstripeltd/ai-refine:client/dist/styles/bundle.css'

---
Name: ai-refine-provider
After: '#ai-core'
---
# Provider defaults for this module. AI_REFINE_* environment variables win, then the shared
# AI_* variables, then these values.
SilverstripeLtd\AiCore\Settings\EnvProviderSettings:
  modules:
    REFINE:
      provider: gemini
      max_tokens: 20000
      request_timeout: 15
      temperature: 0.0
      providers:
        anthropic:
          model: claude-haiku-4-5
        openai:
          model: gpt-5-mini
          temperature: 1.0
        gemini:
          model: gemini-3.1-flash-lite
          thinking_level: low
